name: Java Selenium Tests

on:
  push:
    branches: [ main, with-junit ]
  pull_request:
    branches: [ main, with-junit ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 18

      - name: Install dependencies (jq, unzip, wget)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip wget

      - name: Get latest ChromeDriver version
        id: chromedriver-version
        run: |
          version=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json | jq -r '.channels.stable.chromedriver.version')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Got ChromeDriver version: $version"

      - name: Download and install ChromeDriver
        run: |
          echo "Using ChromeDriver version: ${{ steps.chromedriver-version.outputs.version }}"
          wget https://storage.googleapis.com/chrome-for-testing/${{ steps.chromedriver-version.outputs.version }}/linux64/chromedriver-linux64.zip
          unzip chromedriver-linux64.zip
          chmod +x chromedriver
          sudo mv chromedriver /usr/local/bin/chromedriver

      - name: Run Maven tests
        run: mvn test
