name: Selenium Tests

on:
  push:
    branches: [ with-junit ]
  pull_request:
    branches: [ with-junit ]

jobs:
  test:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk2.0-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 18

      - uses: actions/setup-chrome@v1
      - uses: actions/setup-chromedriver@v1

      - name: Run tests
        run: mvn test
