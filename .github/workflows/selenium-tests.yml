name: Selenium Tests

on:
  push:
    branches:
      - main
      - with-junit
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 18

      - name: Install dependencies for Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip libnss3 libxss1 libasound2 libatk-bridge2.0-0 libgtk-3-0

      - name: Download Chrome for Testing
        run: |
          wget https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/137.0.7151.120/linux64/chromedriver-linux64.zip
          unzip chromedriver-linux64.zip -d $HOME/chromedriver
          sudo mv $HOME/chromedriver/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

      - name: Run Maven tests
        run: mvn test

      - name: Upload Surefire test reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

